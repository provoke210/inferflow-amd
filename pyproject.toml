[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferflow"
version = "0.1.0"
description = "AMD Token Factory commerce inference scheduling and evaluation gateway"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.package-data]
inferflow = ["static/*", "static/assets/*", "static/assets/data/*", "static/assets/materials/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
